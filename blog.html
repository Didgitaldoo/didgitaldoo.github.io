---
layout: default
title: Blog
---
<h1>Blog</h1>

<div class="post-list">
{% for post in site.posts %}
  <a class="post-tile" href="{{ post.url }}">
    <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%-d %B %Y" }}</time>
    <h2>{{ post.title }}</h2>
    <p>{{ post.summary }}</p>
    <span class="read-more">Read more &rarr;</span>
  </a>
{% endfor %}
</div>
